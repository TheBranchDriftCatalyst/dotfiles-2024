# tmux extra config — appended by home/tmux.nix after its nix-interpolated
# lines (default-shell). Options with first-class programs.tmux settings
# (prefix, mouse, baseIndex, keyMode, plugins…) live in the module, not here.

set -g renumber-windows on
set -g set-clipboard on
setw -g pane-base-index 1

# windows keep the names you give them
set -g allow-rename off
set -g set-titles on
set -g set-titles-string "[tmux] #T @ #H"
set -g display-time 3500

# splits inherit the current pane's directory
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# window cycling (repeatable), pane movement, pane resize
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# pane/session lifecycle
bind-key b break-pane
bind-key q kill-pane
bind-key C-q kill-session
bind-key C-x run "tmux kill-pane || tmux kill-window"
bind-key i display-panes

# reload the HM-generated config (not ~/.tmux.conf — that file is gone)
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "[tmux] config reloaded!"

# copy-mode: vi keys, v to select; y is tmux-yank's
setw -g mode-keys vi
bind-key v copy-mode \; display "Copy mode!"
bind-key -T copy-mode-vi v send-keys -X begin-selection

# status line: top, centred, lean until kube/gcp segments are packaged
set -g status-position top
set -g status-justify centre
set -g status-interval 5
set -g status-left-length 90
set -g status-right-length 90
set -g status-left 'tmux:[#P]'
set -g status-right '[%Y-%m-%d(%a) %H:%M]'

# visual activity signals
setw -g monitor-activity on
set -g visual-activity on
setw -g window-status-activity-style bg="colour235"
setw -g pane-border-status top
